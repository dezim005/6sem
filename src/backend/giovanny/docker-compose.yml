# A API .NET usa o schema existente no Neon, sem subir PostgreSQL separado.
# Defina DOTNET_CONNECTION_STRING (formato Npgsql) e JWT_SECRET no ambiente.
services:
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${DOTNET_CONNECTION_STRING:?Informe uma connection string Npgsql do Neon (branch de desenvolvimento)}
      JWT_SECRET: ${JWT_SECRET:?Informe o mesmo segredo utilizado pelo backend Pedro}
    ports:
      - "8080:8080"
